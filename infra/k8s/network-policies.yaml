# Por padrao, nenhum pod do namespace recebe conexao. Cada regra abaixo libera
# so o caminho necessario. Se um pod for invadido, ele nao alcanca o banco
# a menos que seja a API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: negar-tudo
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-recebe-do-ingress
spec:
  podSelector:
    matchLabels:
      app: web
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-recebe-do-web
spec:
  podSelector:
    matchLabels:
      app: api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependencias-recebem-da-api
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["db", "redis", "ollama"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
