# Um unico endereco para o navegador: a interface estatica em / e a API em
# /api. Sem origens diferentes, nao ha CORS em producao.

# Camada extra contra forca bruta, antes de a requisicao chegar a API: 10
# tentativas por minuto por IP nas rotas de login e cadastro. A API tem os
# proprios limites (por e-mail e por IP); este protege a API de ser inundada.
limit_req_zone $binary_remote_addr zone=autenticacao:10m rate=10r/m;
limit_req_status 429;

server {
    # 8080 e nao 80: a imagem roda sem root, e porta abaixo de 1024 exige root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Um pouco acima do limite de 20 MB da API, para o erro vir da API
    # (mensagem clara em portugues) e nao do nginx (pagina 413 generica).
    client_max_body_size 21m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A pagina nao usa camera, microfone, localizacao nem pagamento: bloqueados.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # O export estatico do Next.js usa script inline para hidratar a pagina,
    # por isso o 'unsafe-inline' em script-src. O resto fica restrito a mesma
    # origem. A sessao fica em cookie httpOnly, que script nenhum le.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Valem para as duas locations da API abaixo.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # O IP que o nginx viu, e nao o que o cliente disse: um X-Real-IP enviado
    # pelo navegador e sobrescrito aqui. A API usa este valor no limite por IP.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=autenticacao burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
        # A resposta da IA chega aos pedacos (Server-Sent Events). Com buffer,
        # o nginx juntaria tudo e o usuario so veria a resposta no final.
        proxy_buffering off;
        # Modelo local em CPU pode levar mais de um minuto numa resposta longa.
        proxy_read_timeout 300s;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre, porque
    # qualquer mudanca gera um nome novo.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pagina inexistente devolve a 404 da interface com status 404 de verdade.
    # Com "/404.html" no fim do try_files, ela voltava com status 200.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
