[project]
name = "oraculo"
version = "0.1.0"
description = "API de perguntas e respostas sobre documentos PDF com RAG"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "email-validator>=2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5",
    "redis>=8.1",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.3",
    "pypdf>=6.19",
    "langchain-core>=1.6",
    "langchain-ollama>=1.1",
    "langchain-text-splitters>=1.1",
    "prometheus-fastapi-instrumentator>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.10",
    "fakeredis>=2.30",
    "ruff>=0.16",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraculo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: erros basicos; I: imports ordenados; B: armadilhas comuns;
# UP: sintaxe moderna; S: seguranca (bandit); SIM: simplificacoes.
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert e o jeito do pytest; senha fixa em teste nao e segredo.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Bibliotecas sem anotacao de tipo publicada.
module = ["pgvector.*", "testcontainers.*", "fakeredis.*"]
ignore_missing_imports = true
